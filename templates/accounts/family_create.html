<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Family | Parivaar Health</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary: #2E7D6B; --primary-dark: #1B5E4F; }
        body { background: linear-gradient(135deg, #1B5E4F 0%, #2E7D6B 60%, #4CAF96 100%); min-height: 100vh; display: flex; align-items: center; }
        .setup-card { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .btn-primary { background: var(--primary); border-color: var(--primary); border-radius: 10px; padding: .7rem 2rem; font-weight: 600; }
        .form-control { border-radius: 10px; padding: .65rem 1rem; }
        .step-badge { background: var(--primary); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; }
        .family-icon { font-size: 4rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="setup-card card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="family-icon mb-2">🏠</div>
                        <h5 class="fw-bold mb-1">Set Up Your Family Profile</h5>
                        <div class="d-flex justify-content-center gap-2 mt-2">
                            <span class="step-badge" style="background:#adb5bd">1</span>
                            <span class="text-muted small align-self-center">Account</span>
                            <i class="bi bi-arrow-right text-muted align-self-center"></i>
                            <span class="step-badge">2</span>
                            <span class="text-muted small align-self-center">Family</span>
                            <i class="bi bi-arrow-right text-muted align-self-center"></i>
                            <span class="step-badge" style="background:#adb5bd">3</span>
                            <span class="text-muted small align-self-center">Members</span>
                        </div>
                        <p class="text-muted small mt-2">Your family is the core unit in Parivaar Health</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}<small class="text-muted">{{ field.help_text }}</small>{% endif %}
                            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
                        </div>
                        {% endfor %}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Create Family <i class="bi bi-arrow-right ms-1"></i></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
