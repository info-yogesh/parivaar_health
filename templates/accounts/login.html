<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Parivaar Health</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary: #2E7D6B; --primary-dark: #1B5E4F; }
        body { background: linear-gradient(135deg, #1B5E4F 0%, #2E7D6B 50%, #4CAF96 100%); min-height: 100vh; display: flex; align-items: center; }
        .auth-card { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .auth-logo { width: 64px; height: 64px; background: linear-gradient(135deg, #2E7D6B, #4CAF96); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
        .btn-primary { background: var(--primary); border-color: var(--primary); border-radius: 10px; padding: .7rem; font-weight: 600; }
        .btn-primary:hover { background: var(--primary-dark); }
        .form-control { border-radius: 10px; padding: .65rem 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="auth-card card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-logo">
                            <i class="bi bi-heart-pulse-fill text-white fs-2"></i>
                        </div>
                        <h4 class="fw-bold">Parivaar Health</h4>
                        <p class="text-muted">Sign in to your family health hub</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Sign In <i class="bi bi-arrow-right ms-1"></i></button>
                        </div>
                    </form>
                    <hr class="my-4">
                    <p class="text-center text-muted mb-0">
                        New to Parivaar Health? <a href="{% url 'accounts:register' %}" class="text-decoration-none fw-semibold">Create Account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
