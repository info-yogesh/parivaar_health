<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Parivaar Health</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary: #2E7D6B; --primary-dark: #1B5E4F; }
        body { background: linear-gradient(135deg, #1B5E4F 0%, #2E7D6B 50%, #4CAF96 100%); min-height: 100vh; display: flex; align-items: center; padding: 2rem 0; }
        .auth-card { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .auth-logo { width: 56px; height: 56px; background: linear-gradient(135deg, #2E7D6B, #4CAF96); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto .75rem; }
        .btn-primary { background: var(--primary); border-color: var(--primary); border-radius: 10px; padding: .7rem; font-weight: 600; }
        .btn-primary:hover { background: var(--primary-dark); }
        .form-control { border-radius: 10px; padding: .65rem 1rem; }
        .step-badge { background: var(--primary); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-logo">
                            <i class="bi bi-heart-pulse-fill text-white fs-3"></i>
                        </div>
                        <h5 class="fw-bold mb-1">Create Your Account</h5>
                        <div class="d-flex justify-content-center gap-2 mt-2">
                            <span class="step-badge">1</span>
                            <span class="text-muted small align-self-center">Account</span>
                            <i class="bi bi-arrow-right text-muted align-self-center"></i>
                            <span class="step-badge" style="background:#adb5bd">2</span>
                            <span class="text-muted small align-self-center">Family</span>
                            <i class="bi bi-arrow-right text-muted align-self-center"></i>
                            <span class="step-badge" style="background:#adb5bd">3</span>
                            <span class="text-muted small align-self-center">Members</span>
                        </div>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            {% for field in form %}
                            <div class="col-{% if field.name == 'first_name' or field.name == 'last_name' %}6{% else %}12{% endif %}">
                                <label class="form-label fw-semibold small">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                                {% endif %}
                            </div>
                            {% endfor %}
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Create Account <i class="bi bi-arrow-right ms-1"></i></button>
                        </div>
                    </form>
                    <hr class="my-3">
                    <p class="text-center text-muted mb-0 small">
                        Already have an account? <a href="{% url 'accounts:login' %}" class="text-decoration-none fw-semibold">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
